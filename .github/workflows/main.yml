name: 編譯所有版本並發佈到 Releases
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  MODRINTH_PROJECT: sQx0NhuP
  FABRIC_API_PROJECT: P7dR8mSH
  BUILD_NUMBER: ${{ github.run_number }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置 JDK 21 / 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: 設置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 編譯 1.21.x 版本
        run: |
          chmod +x gradlew
          ./gradlew :1.21.11:build --continue

      - name: 編譯 26.x 版本
        run: |
          ./gradlew --stop
          ./gradlew :26.1:build :26.1.1:build :26.1.2:build :26.2:build :26.3:build --continue

      - name: 收集 jar 檔
        run: |
          mkdir -p release
          for v in 1.21.11 26.1 26.1.1 26.1.2 26.2 26.3; do
            cp "versions/$v/build/libs/"*"+$v.jar" release/
          done
          ls -la release/

      - name: 發佈並上傳 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Version ${{ github.run_number }} | ${{ github.event.head_commit.message }}
          body: |
            支援 Minecraft ` 1.21.11 ` ~ ` 26.3 `，玩家請到 https://www.brilliantw.net/mod/ 下載。

            另需要對應版本的 [Fabric Loader](https://fabricmc.net/use/installer/) 與 [Fabric API](https://modrinth.com/mod/fabric-api)。

            本模組為閉源軟體，著作權所有（All Rights Reserved），請勿轉載。
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*.jar

      - name: 上傳到 Modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          BUILD: v${{ github.run_number }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          token=$(printf '%s' "$MODRINTH_TOKEN" | tr -d '[:space:]')
          token=${token#Bearer}
          mod_version=$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          for jar in release/*.jar; do
            mc=$(basename "$jar" .jar)
            mc=${mc##*+}
            number="$mod_version-$BUILD-$mc"
            data=$(jq -n \
              --arg name "輝煌模組 Brilliant Server Mod $mod_version" \
              --arg number "$number" \
              --arg changelog "${CHANGELOG:-$number}" \
              --arg mc "$mc" \
              --arg project "$MODRINTH_PROJECT" \
              --arg fabric "$FABRIC_API_PROJECT" \
              '{name: $name, version_number: $number, changelog: $changelog, game_versions: [$mc], loaders: ["fabric"],
                version_type: "release", featured: false, project_id: $project,
                dependencies: [{project_id: $fabric, dependency_type: "required"}],
                file_parts: ["file"], primary_file: "file"}')
            echo "上傳 $number"
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: $token" \
              -H "User-Agent: BrilliantTeam/brilliant-server-mod (GitHub Actions)" \
              --form-string "data=$data" \
              -F "file=@$jar;type=application/java-archive")
            cat response.json
            echo
            if [ "$status" = 401 ]; then
              echo "::error::Modrinth 拒絕了 MODRINTH_TOKEN（HTTP 401）：請確認 Token 是 mrp_ 開頭、未過期、未刪除，且有勾選 Create versions 權限"
              exit 1
            fi
            if [ "$status" -ge 300 ]; then
              echo "::error::上傳 $number 失敗（HTTP $status）"
              exit 1
            fi
          done
